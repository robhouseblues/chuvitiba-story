# The day's Instagram Story: chuvitibahoje.com/story recorded as a video
# (scripts/story-video.mjs), kept as the run's artifact for a week, and, when the site asked
# for it (the `pedido` it started the run with), handed back to the site, which posts it
# (scripts/story-post.mjs). From the same moment's page, the day's card for X and its caption
# (chuvitibahoje.com/card, scripts/story-card.mjs), kept as an artifact too and not posted
# anywhere yet; if they can't be made, the Story goes on without them. Started by the site each
# morning and from its dashboard; by hand from the Actions tab, without a `pedido`, it only
# records.
name: Story do dia

on:
  workflow_dispatch:
    inputs:
      pedido:
        description: Pedido do site (vazio para só gravar)
        required: false
        default: ''
      url:
        description: Página a gravar
        required: true
        default: https://chuvitibahoje.com/story
      card:
        description: Card do X a fazer
        required: true
        default: https://chuvitibahoje.com/card

permissions:
  contents: read
  # The run's identity token, which tells the site it is this workflow calling.
  id-token: write

concurrency:
  group: story

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PEDIDO: ${{ inputs.pedido }}
      URL: ${{ inputs.url }}
      CARD: ${{ inputs.card }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Ubuntu's mirror can slow to a crawl (once, installing took the run's 30 minutes and nothing
      # was recorded), so apt keeps its downloads in ~/apt, carried over from the last run, and
      # fetches only what Ubuntu updated since. An install that still drags on fails in time to
      # tell the site.
      - uses: actions/cache@v6
        with:
          path: ~/apt
          key: apt-${{ runner.os }}-${{ github.run_id }}
          restore-keys: apt-${{ runner.os }}-
      - run: |
          mkdir -p ~/apt/partial
          echo "Dir::Cache::Archives \"$HOME/apt\";" | sudo tee /etc/apt/apt.conf.d/90chuvitiba
      - run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 10
      - id: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        timeout-minutes: 10
      # apt wrote them as root; the cache is saved as the runner.
      - run: sudo chown -R "$(id -u):$(id -g)" ~/apt
      - id: video
        run: node scripts/story-video.mjs --url "$URL" --saida story.mp4
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        with:
          name: story
          path: story.mp4
          retention-days: 7
      # The card checks itself and refuses rather than show a wrong answer; that never holds up the Story.
      - id: card
        continue-on-error: true
        run: node scripts/story-card.mjs --url "$CARD" --saida card.png --legenda card.txt
      - if: steps.card.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: card
          path: |
            card.png
            card.txt
          retention-days: 7
      - if: env.PEDIDO != ''
        run: node scripts/story-post.mjs --pedido "$PEDIDO" --video story.mp4
      # Out of time is cancelled, not failed, and the site still has to hear it. It hears where the
      # run stopped too: getting ready (installing), recording, or sending the video.
      - if: (failure() || cancelled()) && env.PEDIDO != ''
        run: node scripts/story-post.mjs --pedido "$PEDIDO" --falhou --etapa "$ETAPA"
        env:
          ETAPA: ${{ job.status == 'cancelled' && 'tempo' || steps.video.outcome == 'success' && 'enviar' || steps.ffmpeg.outcome == 'success' && 'gravar' || 'preparar' }}
